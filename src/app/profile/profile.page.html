<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="profile">
  <div class="avatar-wrapper">
    <img [src]="profile.avatar" [alt]="profile.username" class="avatar-image" />
  </div>

  <ion-list>
    <ion-item>
      <ion-label>Username</ion-label>
      <ion-note slot="end">{{ profile.username }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Email</ion-label>
      <ion-note slot="end">{{ profile.email }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Address</ion-label>
      <ion-note slot="end">{{ profile.address }}</ion-note>
    </ion-item>
    <ion-item button detail>
      <ion-label>Student Detail</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
